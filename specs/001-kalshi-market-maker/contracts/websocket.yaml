# Kalshi WebSocket v2 - Message Schemas

asyncapi: 2.6.0
info:
  title: Kalshi WebSocket API v2
  version: 2.0.0
  description: Real-time market data for FiftyFive bot

servers:
  production:
    url: wss://trading-api.kalshi.com/trade-api/ws/v2
    protocol: wss
  demo:
    url: wss://demo-api.kalshi.co/trade-api/ws/v2
    protocol: wss

channels:
  orderbook_delta/{ticker}:
    subscribe:
      summary: Subscribe to order book deltas
      message:
        oneOf:
          - $ref: '#/components/messages/SubscribeRequest'
          - $ref: '#/components/messages/OrderBookDelta'

components:
  messages:
    SubscribeRequest:
      summary: Subscribe to channel
      payload:
        type: object
        properties:
          id:
            type: integer
          cmd:
            type: string
            enum: [subscribe]
          params:
            type: object
            properties:
              channels:
                type: array
                items:
                  type: string
                  example: "orderbook_delta:KXHARRIS24"

    OrderBookDelta:
      summary: Incremental order book update
      payload:
        type: object
        properties:
          type:
            type: string
            const: orderbook_delta
          seq:
            type: integer
            description: Sequence number (must increment by 1)
          msg:
            type: object
            properties:
              market_ticker:
                type: string
              yes:
                type: array
                items:
                  type: array
                  items:
                    - type: integer  # price in cents
                    - type: integer  # quantity (0 = remove level)
              no:
                type: array
              timestamp:
                type: integer
                description: Unix timestamp milliseconds

    Heartbeat:
      summary: Heartbeat ping/pong
      payload:
        type: object
        properties:
          type:
            type: string
            enum: [ping, pong]
          timestamp:
            type: integer
